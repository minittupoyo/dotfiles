# Generated by Matugen
palette = "matugen"

[palettes.matugen]
prompt_color = "{{ colors.primary_container.light.hex }}"
error_color  = "{{ colors.error.default.hex }}"

[character]
success_symbol = "[❯](prompt_color bold)"
error_symbol   = "[❯](error_color bold)"

[directory]
style = "prompt_color bold"
