<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- シェルの主フォント (Google Sans Flex) のフォールバック順を固定する。
     QML の font には複数ファミリー指定がないため fontconfig 側で行う。
     LANG=en_US だと日本語が Noto Sans CJK KR (韓国語字形) に落ちるので JP を明示する。 -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>Google Sans Flex</string></test>
    <edit name="family" mode="append" binding="weak"><string>Roboto Flex</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK JP</string></edit>
  </match>
</fontconfig>
