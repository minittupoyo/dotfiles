# kitty の設定。配色は matugen が出力する colors.conf (壁紙に追従)。
include colors.conf

# ---- フォント ----
# 英数字は JetBrains Mono。日本語 (かな・漢字・全角) は、字形を日本語に固定するため Noto Sans Mono CJK JP を明示する
# (指定しないと、既定の monospace が Noto Sans Mono CJK KR = 韓国語の字形に解決される)。絵文字は Noto Color Emoji、
# Nerd Font のアイコンは kitty 内蔵の記号フォントが自動で補う。
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
symbol_map U+3000-U+30FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Noto Sans Mono CJK JP

# ---- 見た目 ----
window_padding_width 12
background_opacity   1.0
cursor_shape         beam
cursor_blink_interval 0
url_style            curly
cursor_trail 1

# ---- 動作 ----
scrollback_lines     10000
enable_audio_bell    no
shell_integration    enabled
